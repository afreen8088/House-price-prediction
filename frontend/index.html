<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOMESTEAD — House Price Prediction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Playfair+Display:ital,wght@0,500..800;1,500..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="page-container">
    <header class="app-header">
      <div class="brand-title">HOMESTEAD</div>
    </header>

    <div class="card">
      <div class="card-intro">
        <h1 class="main-heading">House Price Prediction</h1>
        <p class="description">Estimate your property's value in Karnataka.</p>
      </div>

      <form id="prediction-form" novalidate>
        <!-- Location Dropdown -->
        <div class="form-group">
          <label for="location" class="form-label">Location</label>
          <select id="location" name="location" class="form-select" required>
            <option value="" disabled selected>Select a city in Karnataka</option>
            <option value="Bengaluru">Bengaluru</option>
            <option value="Mysuru">Mysuru</option>
            <option value="Mangaluru">Mangaluru</option>
            <option value="Hubballi-Dharwad">Hubballi-Dharwad</option>
            <option value="Belagavi">Belagavi</option>
            <option value="Kalaburagi">Kalaburagi</option>
            <option value="Davanagere">Davanagere</option>
            <option value="Shivamogga">Shivamogga</option>
            <option value="Tumakuru">Tumakuru</option>
            <option value="Udupi">Udupi</option>
            <option value="Hassan">Hassan</option>
            <option value="Ballari">Ballari</option>
          </select>
          <div class="field-error" id="error-location"></div>
        </div>

        <!-- Property Area -->
        <div class="form-group">
          <label for="sqft" class="form-label">Property area in square feet</label>
          <div class="input-wrapper">
            <input
              type="number"
              id="sqft"
              name="sqft"
              class="form-input"
              placeholder="e.g. 1500"
              min="101"
              max="24999"
              step="any"
              required
            >
            <span class="input-unit">sq ft</span>
          </div>
          <div class="field-error" id="error-sqft"></div>
        </div>

        <!-- Bedrooms & Bathrooms Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="bedrooms" class="form-label">Number of bedrooms</label>
            <input
              type="number"
              id="bedrooms"
              name="bedrooms"
              class="form-input"
              placeholder="e.g. 3"
              min="1"
              max="20"
              step="1"
              required
            >
            <div class="field-error" id="error-bedrooms"></div>
          </div>

          <div class="form-group">
            <label for="bathrooms" class="form-label">Number of bathrooms</label>
            <input
              type="number"
              id="bathrooms"
              name="bathrooms"
              class="form-input"
              placeholder="e.g. 2"
              min="0.5"
              max="15"
              step="0.5"
              required
            >
            <div class="field-error" id="error-bathrooms"></div>
          </div>
        </div>

        <!-- Predict Button -->
        <button type="submit" class="btn-predict" id="btn-predict">
          <span class="btn-text">Predict Price</span>
          <span class="btn-spinner" style="display: none;"></span>
        </button>

        <div class="form-alert" id="form-alert" style="display: none;"></div>
      </form>

      <!-- Result Section -->
      <section class="result-section" id="result-section" style="display: none;">
        <div class="result-divider"></div>
        <div class="result-header">
          <span class="result-eyebrow">Estimated Property Price</span>
          <div class="result-price" id="result-price">₹0</div>
        </div>

        <div class="result-details-grid">
          <div class="result-detail-box">
            <span class="detail-label">Property Location</span>
            <span class="detail-val" id="result-location">—</span>
          </div>
          <div class="detail-item-box">
            <span class="detail-label">Area</span>
            <span class="detail-val" id="result-area">—</span>
          </div>
          <div class="detail-item-box">
            <span class="detail-label">Bedrooms & Bathrooms</span>
            <span class="detail-val" id="result-rooms">—</span>
          </div>
          <div class="detail-item-box">
            <span class="detail-label">Estimated Rate</span>
            <span class="detail-val" id="result-rate">—</span>
          </div>
        </div>

        <p class="result-disclaimer">
          Demonstration estimate based on statistical modeling, not a verified market valuation.
        </p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
