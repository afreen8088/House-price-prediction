name: CI/CD Pipeline - House Price Prediction MLOps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    name: Lint, Test, and Verify Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Module Imports
        run: |
          python -c "import xgboost, sklearn, mlflow, fastapi, dvc, pytest; print('All core modules imported successfully')"

      - name: Run Test Suite
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          pytest tests/ -v --durations=10

  docker-build:
    name: Build Production Docker Image
    needs: test-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
            --tag house-price-mlops:latest \
            --tag house-price-mlops:${{ github.sha }} \
            .

      - name: Verify Docker Container Smoke Test
        run: |
          # Start container in detached mode
          docker run -d --name house-price-app -p 8000:8000 house-price-mlops:latest
          
          # Wait for container startup
          sleep 5
          
          # Verify health probe
          curl --fail http://localhost:8000/health || (docker logs house-price-app && exit 1)
          
          # Clean up
          docker stop house-price-app
          docker rm house-price-app
