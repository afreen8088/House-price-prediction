preprocess:
  test_size: 0.2
  random_state: 42
  raw_data_path: "data/raw/housing_data.csv"
  processed_dir: "data/processed"

train:
  random_state: 42
  n_estimators: 150
  max_depth: 5
  learning_rate: 0.08
  subsample: 0.85
  colsample_bytree: 0.85
  model_output_path: "model.joblib"
  metrics_output_path: "metrics.json"
  experiment_name: "house_price_prediction"
